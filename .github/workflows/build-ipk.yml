name: Verify Omnia on OpenWrt

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  static:
    name: Static Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Provision Static Tools
        run: sudo apt-get update && sudo apt-get install -y python3-jsonschema python3-yaml

      - name: Validate Source Files
        run: bash ./tests/ci-static.sh

      - name: Validate UCode Modules
        run: |
          docker run --rm \
            -v "$PWD:/work:ro" \
            openwrt/rootfs:latest \
            sh -c 'find /work/luci-app-omnia/root/usr/share/ucode -type f -name "*.uc" -exec sh -c '\''for file do ucode -L /work/luci-app-omnia/root/usr/share/ucode -c,module -o /tmp/omnia-ucode-check "$file" || exit $?; done'\'' sh {} +'

      - name: Test Control Path Encoding
        run: |
          docker run --rm -v "$PWD:/work:ro" openwrt/rootfs:latest \
            ucode -L /work/luci-app-omnia/root/usr/share/ucode /work/tests/control-encoding.uc

      - name: Test sing-box protobuf decoding
        run: |
          docker run --rm -v "$PWD:/work:ro" openwrt/rootfs:latest \
            ucode -L /work/luci-app-omnia/root/usr/share/ucode /work/tests/grpc-proto.uc

  build:
    name: Assemble Packages
    runs-on: ubuntu-latest
    needs: static
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Package Release
        run: |
          sed -i "s/^PKG_RELEASE:=.*/PKG_RELEASE:=${GITHUB_RUN_NUMBER}/" luci-app-omnia/Makefile
          grep '^PKG_RELEASE:=' luci-app-omnia/Makefile

      - name: Provision Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gettext
          wget https://raw.githubusercontent.com/openwrt/openwrt/master/scripts/ipkg-build -O /usr/local/bin/ipkg-build
          chmod +x /usr/local/bin/ipkg-build

      - name: Build IPK Package
        run: bash ./scripts/build.sh ipk

      - name: Build APK Package
        env:
          APK_SIGNING_KEY_B64: ${{ secrets.APK_SIGNING_KEY_B64 }}
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -e APK_SIGNING_KEY_B64 \
            -w /work \
            alpine:latest \
            sh -lc 'apk add --no-cache bash apk-tools coreutils findutils sed grep ca-certificates && if [ -n "$APK_SIGNING_KEY_B64" ]; then mkdir -p build/signing && printf "%s" "$APK_SIGNING_KEY_B64" | base64 -d > build/signing/omnia.rsa && chmod 0600 build/signing/omnia.rsa && export APK_SIGNING_KEY=/work/build/signing/omnia.rsa; fi && bash ./scripts/build.sh apk'

      - name: Upload IPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnia-ipk-${{ github.sha }}
          path: '*.ipk'
          if-no-files-found: error
          retention-days: 7

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnia-apk-${{ github.sha }}
          path: '*.apk'
          if-no-files-found: error
          retention-days: 7
