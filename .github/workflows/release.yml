name: Release Omnia Packages

on:
  pull_request:
    types: [ closed ]
    branches: [ master ]
  workflow_dispatch:
    inputs:
      version:
        description: '指定新版本，例如 2.0.0；留空自动递增补丁版本'
        required: false
        type: string

concurrency:
  group: omnia-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Packages
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && !startsWith(github.event.pull_request.title, '[manual-release]'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Release Commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Release Version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/master' ]; then
            echo 'Releases must run on master' >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            git fetch origin master
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/master)" ]; then
              echo 'master has advanced; run the manual release again on the latest commit' >&2
              exit 1
            fi
          fi
          VERSION="$(bash scripts/release-version.sh "$REQUESTED_VERSION")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=${VERSION}/" luci-app-omnia/Makefile
          sed -i 's/^PKG_RELEASE:=.*/PKG_RELEASE:=1/' luci-app-omnia/Makefile
          grep '^PKG_\(VERSION\|RELEASE\):=' luci-app-omnia/Makefile

      - name: Provision Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gettext
          wget https://raw.githubusercontent.com/openwrt/openwrt/master/scripts/ipkg-build -O /usr/local/bin/ipkg-build
          chmod +x /usr/local/bin/ipkg-build

      - name: Build IPK Package
        run: bash ./scripts/build.sh ipk

      - name: Build APK Package
        env:
          APK_SIGNING_KEY_B64: ${{ secrets.APK_SIGNING_KEY_B64 }}
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -e APK_SIGNING_KEY_B64 \
            -w /work \
            alpine:latest \
            sh -lc 'apk add --no-cache bash apk-tools coreutils findutils sed grep ca-certificates && if [ -n "$APK_SIGNING_KEY_B64" ]; then mkdir -p build/signing && printf "%s" "$APK_SIGNING_KEY_B64" | base64 -d > build/signing/omnia.rsa && chmod 0600 build/signing/omnia.rsa && export APK_SIGNING_KEY=/work/build/signing/omnia.rsa; fi && bash ./scripts/build.sh apk'

      - name: Create Release Tag
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "v$RELEASE_VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/v$RELEASE_VERSION"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            *.ipk
            *.apk
          fail_on_unmatched_files: true
